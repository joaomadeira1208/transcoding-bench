# Evidência anexada a cada PR, não gate autônomo (ADR-0017). Fora por design:
# credencial AWS e o build do Docker.

name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # O hook terraform_validate exige o binário no PATH; o pre-commit não
      # gerencia esse ambiente.
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py3.12-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: python -m pip install pre-commit==4.6.1

      - name: pre-commit run --all-files
        run: pre-commit run --all-files --show-diff-on-failure

  # Um venv por papel, com só o `requirements-dev.txt` daquele papel: é o que faz
  # um `import` sem dependência declarada quebrar aqui em vez de passar porque a
  # máquina do pesquisador tinha o pacote.
  orchestrator-tests:
    name: pytest (orchestrator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Create the role venv
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r orchestrator/requirements-dev.txt

      - name: pytest orchestrator/
        run: .venv/bin/python -m pytest orchestrator/

  analysis-tests:
    name: pytest (analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Create the role venv
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r analysis/requirements-dev.txt

      - name: pytest analysis/
        run: .venv/bin/python -m pytest analysis/
