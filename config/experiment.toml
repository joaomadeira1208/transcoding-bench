# Definição do Experimento — fonte de verdade declarativa (ADR-0019), e o anexo do
# artigo. O gerador do plano é função pura deste arquivo.
#
# Nada aqui tem default: campo ausente, tipo divergente ou chave desconhecida
# fazem a validação falhar alto nomeando o registro ofensor.

# 6 Execuções por Cenário: 1 warm-up descartado + 5 Replicações (ADR-0003).
[experiment]
# Aqui, e não na linha de comando: reproduzir a ordem do Experimento não pode
# depender de lembrar o comando que alguém digitou.
seed = 20260808
replications = 5
warmup_runs = 1

# Parâmetros idênticos em todo Cenário (ADR-0002).
[encode]
# Auto-detect: fixar um valor esconderia a assimetria estrutural ARM/x86, que é o
# que se quer medir.
threads = 0
# Em frames, e fixo: subir para 60 "para manter 2 s" no vídeo a 30 fps quebraria o
# GOP idêntico entre Cenários (ADR-0002). O corte por mudança de cena é desativado
# por `encoder_args`, cuja flag difere entre os encoders.
gop_size = 48
pix_fmt = "yuv420p"
strip_audio = true
container = "mkv"
scale_flags = "lanczos"

# Desenho experimental, não constante de script (ADR-0006): IPC, cache miss rate e
# branch mispredict rate saem daqui, e trocar um evento muda o que o artigo
# reporta. A ordem é a que vai para o `-e` do `perf stat`.
[instrumentation]
pmu_events = [
  "cycles",
  "instructions",
  "cache-references",
  "cache-misses",
  "branch-instructions",
  "branch-misses",
  "task-clock",
  "context-switches",
  "cpu-migrations",
  "page-faults",
]

# Codecs (ADR-0002). O `slug` entra na `scenario_id`; `codec` é rótulo humano, e o
# CRF não é intercambiável entre eles (ADR-0005).
#
# O `bitstream_muxer` é declarado, e não derivado do `slug`, pelo mesmo motivo que
# a `scenario_id` é formada em Python (ADR-0019).
[[codec]]
slug = "libx264"
codec = "h264"
encoder = "libx264"
preset = "medium"
crf = 23
encoder_args = ["-sc_threshold", "0"]
bitstream_muxer = "h264"

[[codec]]
slug = "libx265"
codec = "h265"
encoder = "libx265"
preset = "medium"
crf = 28
encoder_args = ["-x265-params", "scenecut=0"]
bitstream_muxer = "hevc"

[[codec]]
slug = "libsvtav1"
codec = "av1"
encoder = "libsvtav1"
# String em todos os registros porque o SVT-AV1 numera os seus; vai literal para
# o `-preset`.
preset = "8"
crf = 35
encoder_args = ["-svtav1-params", "scd=0"]
bitstream_muxer = "obu"

# Pares input→output (ADR-0004). Declarados um a um é o ponto: "nunca upscale" é
# dado, não um filtro que alguém pode afrouxar em código.
[[pair]]
input_res = "2160p"
output_res = "2160p"

[[pair]]
input_res = "2160p"
output_res = "1080p"

[[pair]]
input_res = "2160p"
output_res = "720p"

[[pair]]
input_res = "2160p"
output_res = "480p"

[[pair]]
input_res = "1080p"
output_res = "1080p"

[[pair]]
input_res = "1080p"
output_res = "720p"

[[pair]]
input_res = "1080p"
output_res = "480p"

[[pair]]
input_res = "720p"
output_res = "720p"

[[pair]]
input_res = "720p"
output_res = "480p"

# Os rótulos são **nominais** (ADR-0023): Big Buck Bunny é 16:9 e Tears of Steel é
# ~2.24:1, então "1080p" não é 1920x1080 para os dois. Declarar largura × altura
# torna "nunca upscale" uma propriedade verificável sobre pixels.
[[video]]
slug = "bbb"
title = "Big Buck Bunny"
frame_rate = "30/1"
frames = 19036

[video.geometry]
2160p = { width = 3840, height = 2160 }
1080p = { width = 1920, height = 1080 }
720p = { width = 1280, height = 720 }
480p = { width = 854, height = 480 }

[video.source]
url = "https://download.blender.org/demo/movies/BBB/bbb_sunflower_2160p_30fps_normal.mp4.zip"
file = "bbb_sunflower_2160p_30fps_normal.mp4"
size = 633016449
sha256 = "37f0ff251a606c2dcfa26c19fe6bf843234b4e7a8889cfab50bc26f644e55520"

# O tier 2160p é o master 4K oficial (3840 de largura, ADR-0023); os demais seguem
# a largura nominal do ladder preservando o AR.
[[video]]
slug = "tos"
title = "Tears of Steel"
frame_rate = "24/1"
frames = 17616

[video.geometry]
2160p = { width = 3840, height = 1714 }
1080p = { width = 1920, height = 856 }
720p = { width = 1280, height = 572 }
480p = { width = 854, height = 382 }

[video.source]
url = "https://download.blender.org/demo/movies/ToS/tearsofsteel_4k.mov.zip"
file = "tearsofsteel_4k.mov"
size = 6737592810
sha256 = "89b7fd21c7729b7d5071af993939997f847b5af06613a3388ba158dae9e52ab3"

# Instâncias (ADR-0001). `id` e `instance_type` são declarados lado a lado porque
# nenhum pode ser derivado do outro por manipulação de string.
[[instance]]
id = "c7g"
instance_type = "c7g.xlarge"
arch = "arm64"

[[instance]]
id = "c7i"
instance_type = "c7i.xlarge"
arch = "x86_64"

[[instance]]
id = "c7a"
instance_type = "c7a.xlarge"
arch = "x86_64"
