# Definição do Experimento — fonte de verdade declarativa (ADR-0019).
#
# Este arquivo *é* a spec da matriz experimental: quem quiser saber quais
# Cenários o Experimento tem lê aqui, sem ler código. O gerador do plano
# (`orchestrator/generate_scenarios.py`) é função pura deste arquivo — mesma
# entrada, mesmos bytes de saída —, então o `scenarios.json` nunca contradiz o
# que está escrito abaixo, e o anexo do artigo é este TOML.
#
# Forma: array-of-tables, porque os parâmetros têm dependências. Preset e CRF
# viajam *dentro* do registro do codec (ADR-0002), não como eixos livres, e os
# pares input→output são um conjunto recortado (ADR-0004), não um filtro
# aplicado em código.
#
# Nada aqui tem default: campo ausente, tipo divergente ou chave desconhecida
# fazem a validação falhar alto nomeando o registro ofensor.

# Desenho experimental (ADR-0003): 6 Execuções por Cenário — 1 warm-up
# descartado + 5 Replicações reportadas, que sustentam média, desvio padrão e
# IC 95% via t-Student.
[experiment]
# A seed mora aqui, e não na linha de comando, para que o plano seja função pura
# deste arquivo: reproduzir a ordem do Experimento não depende de lembrar o
# comando exato que alguém digitou. O valor é arbitrário; o que importa é estar
# congelado e versionado.
seed = 20260808
replications = 5
warmup_runs = 1

# Parâmetros de encode idênticos em todo Cenário (ADR-0002). Ficam na spec para
# que o argv do FFmpeg seja inteiramente derivado de dado versionado — o bash
# copia, nunca deriva (ADR-0019).
[encode]
# Auto-detect: deixa a assimetria estrutural ARM/x86 emergir (Graviton 3 entrega
# 4 cores físicos sem SMT; Sapphire Rapids e EPYC, 2 físicos × 2 threads).
# Fixar `-threads 4` esconderia exatamente o que se quer medir.
threads = 0
# GOP determinístico de 2s @ 24fps, idêntico nos três encoders. O corte por
# mudança de cena é desativado por `encoder_args`, cuja flag difere entre eles.
gop_size = 48
pix_fmt = "yuv420p"
strip_audio = true
container = "mkv"
# Downscale Lanczos, o que pipelines ABR de produção usam (ADR-0004).
scale_flags = "lanczos"

# Codecs (ADR-0002). O `slug` é o token que entra na `scenario_id` e é o nome do
# encoder, conforme o exemplo canônico do CONTEXT.md
# (`libx264_2160p_1080p_bbb_c7g_rep1`); `codec` é o rótulo de leitura humana.
# CRF não é intercambiável entre codecs — cada um tem o seu alvo de qualidade, e
# qualidade não é variável dependente (ADR-0005).
[[codec]]
slug = "libx264"
codec = "h264"
encoder = "libx264"
preset = "medium"
crf = 23
encoder_args = ["-sc_threshold", "0"]

[[codec]]
slug = "libx265"
codec = "h265"
encoder = "libx265"
preset = "medium"
crf = 28
encoder_args = ["-x265-params", "scenecut=0"]

[[codec]]
slug = "libsvtav1"
codec = "av1"
encoder = "libsvtav1"
# Preset é string em todos os registros porque o SVT-AV1 numera os seus; o valor
# vai literal para `-preset`.
preset = "8"
crf = 35
encoder_args = ["-svtav1-params", "scd=0"]

# Pares input→output (ADR-0004). Os 9 registros são o conjunto recortado: só
# downscale ou no-scale, nunca upscale. Estarem declarados um a um é o ponto —
# "nunca upscale" é dado, não um filtro que alguém pode afrouxar em código.
[[pair]]
input_res = "2160p"
output_res = "2160p"

[[pair]]
input_res = "2160p"
output_res = "1080p"

[[pair]]
input_res = "2160p"
output_res = "720p"

[[pair]]
input_res = "2160p"
output_res = "480p"

[[pair]]
input_res = "1080p"
output_res = "1080p"

[[pair]]
input_res = "1080p"
output_res = "720p"

[[pair]]
input_res = "1080p"
output_res = "480p"

[[pair]]
input_res = "720p"
output_res = "720p"

[[pair]]
input_res = "720p"
output_res = "480p"

# Vídeos, com a geometria exata de cada tier (ADR-0023).
#
# Os rótulos `2160p/1080p/720p/480p` são **nominais**: Big Buck Bunny é 16:9 e
# Tears of Steel é ~2.39:1, então "1080p" não é 1920x1080 para os dois. Declarar
# largura × altura por vídeo faz o `-vf scale=W:H:flags=lanczos` receber valores
# literais e torna "nunca upscale" uma propriedade verificável sobre pixels.
[[video]]
slug = "bbb"
title = "Big Buck Bunny"

[video.geometry]
2160p = { width = 3840, height = 2160 }
1080p = { width = 1920, height = 1080 }
720p = { width = 1280, height = 720 }
480p = { width = 854, height = 480 }

# Tears of Steel: o tier 2160p é o master DCI 4K nativo (4096x1714); os demais
# seguem a largura nominal do ladder preservando o AR nativo (ADR-0023).
[[video]]
slug = "tos"
title = "Tears of Steel"

[video.geometry]
2160p = { width = 4096, height = 1714 }
1080p = { width = 1920, height = 804 }
720p = { width = 1280, height = 536 }
480p = { width = 854, height = 358 }

# Instâncias (ADR-0001): mesma geração `c7*` e mesmo tamanho `xlarge` (4 vCPU),
# variando só a arquitetura. `id` é a chave legível que entra na `scenario_id` e
# nomeia a fatia do plano; `instance_type` é o parâmetro que vai para a AWS.
# Os dois são declarados lado a lado porque nenhum pode ser derivado do outro
# por manipulação de string — é o mesmo risco que faz o Python formar a
# `scenario_id` em vez do bash (ADR-0019).
[[instance]]
id = "c7g"
instance_type = "c7g.xlarge"
arch = "arm64"

[[instance]]
id = "c7i"
instance_type = "c7i.xlarge"
arch = "x86_64"

[[instance]]
id = "c7a"
instance_type = "c7a.xlarge"
arch = "x86_64"
