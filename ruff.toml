# Não há `pyproject.toml`: a ADR-0017 o rejeitou junto com o `pip install -e`.

# 3.12 é o que o Ubuntu 24.04 LTS entrega (ADR-0015) e o que tem `tomllib`.
target-version = "py312"
line-length = 100

[lint]
select = [
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "UP",  # pyupgrade
  "SIM", # flake8-simplify
  "RUF",
]

[format]
docstring-code-format = true
